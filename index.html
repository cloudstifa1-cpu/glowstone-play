<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1026">
<title>Glowstone Grove</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glowstone">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="s.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div id="app">
  <header id="hud">
    <button id="pauseBtn" class="icon-btn" aria-label="Pause">❚❚</button>
    <div class="hud-mid"><div class="mode" id="modeLbl">ENDLESS GROVE</div><div id="score" class="score">0</div></div>
    <div class="hud-right" id="hudR"></div>
  </header>
  <div id="goal" hidden></div>
  <div id="nextRow"><span class="next-label">NEXT</span><div id="next1" class="next big"></div><div id="next2" class="next small"></div><div id="rise" class="rise-pill"></div></div>
  <div id="boardWrap"><div id="board"></div><div id="cols"></div><div id="fx"></div></div>
  <div id="powers"><button id="pRow" class="pwr"></button><button id="pCol" class="pwr"></button></div>
  <div id="tip"></div>
</div>

<div id="home" class="screen"></div>
<div id="pause" class="screen dim" hidden></div>
<div id="over" class="screen dim" hidden></div>
<div id="help" class="screen" hidden></div>
<div id="map" class="screen" hidden></div>
<div id="hold" hidden></div>

<script src="g1.js"></script><script src="g2.js"></script><script src="g3.js"></script><script src="g4.js"></script><script src="g5.js"></script><script src="g6.js"></script>
</body>
</html>
