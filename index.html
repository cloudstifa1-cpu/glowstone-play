:root{--bg:#0B1026;--panel:#1A1F4A;--line:#2E3577;--gold:#FFD447;--lime:#7CFF6B;--cyan:#3FE0FF;--coral:#FF5A5F;--cell:56px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
body{background:radial-gradient(ellipse at 50% 0%,#1d2a6b 0%,var(--bg) 55%) fixed;}
button{font-family:inherit;cursor:pointer;border:none;}
[hidden]{display:none!important;}

#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 12px 12px;}
#hud{width:calc(var(--cell)*6 + 16px);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.icon-btn{width:48px;height:48px;border-radius:14px;background:var(--panel);border:2px solid var(--line);color:#fff;font:800 18px Nunito;letter-spacing:-1px;}
.hud-mid{text-align:center;flex:1;}
.mode{font:600 13px Fredoka;letter-spacing:.14em;color:var(--cyan);}
.score{font:700 32px Fredoka;line-height:1.1;}
.hud-right{text-align:right;font-size:15px;line-height:1.5;}
.best{color:#fff;}.light{color:var(--gold);}

#nextRow{display:flex;align-items:center;gap:12px;margin:8px 0 10px;height:60px;}
.next-label{font:600 15px Fredoka;letter-spacing:.14em;color:#fff;}
.next{position:relative;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
.next.big{width:58px;height:58px;border-color:var(--gold);box-shadow:0 0 14px #FFD44755;}
.next.small{width:42px;height:42px;opacity:.9;}
.next .gem{position:relative;inset:auto;width:100%;height:100%;}

#boardWrap{position:relative;padding:8px;border-radius:20px;background:var(--panel);border:2px solid var(--line);box-shadow:0 10px 40px #0008,inset 0 0 30px #0006;}
#board{display:grid;grid-template-columns:repeat(6,var(--cell));grid-template-rows:repeat(7,var(--cell));}
.cell{position:relative;border:1px solid #2E357766;}
.cell::after{content:"";position:absolute;inset:30%;border-radius:50%;background:#2E357755;}
#cols{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(6,1fr);}
.col{border-radius:12px;transition:background .12s;}
.col.on{background:linear-gradient(180deg,#FFD44733,#FFD44708);box-shadow:inset 0 0 0 2px #FFD44766;}
#fx{position:absolute;inset:8px;pointer-events:none;}

.gem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.gem::before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 62%);opacity:.38;}
.gem svg{position:relative;width:82%;height:82%;overflow:visible;}
.gem .num{position:absolute;right:6%;bottom:4%;font:800 13px Nunito;color:#fff;background:#0B1026cc;border-radius:7px;padding:0 5px;line-height:17px;display:none;}
body.nums .gem .num{display:block;}
.g8 svg{animation:shimmer 1.2s linear infinite;}
@keyframes shimmer{0%{filter:hue-rotate(0deg) brightness(1.2);}100%{filter:hue-rotate(360deg) brightness(1.2);}}

.falling{position:absolute;width:var(--cell);height:var(--cell);transition-property:transform;transition-timing-function:cubic-bezier(.5,0,1,1);}
.rise-pill{margin-left:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:86px;height:52px;border-radius:14px;background:var(--panel);border:2px solid var(--cyan);color:#fff;}
.rise-pill span{font:600 11px Fredoka;letter-spacing:.06em;color:var(--cyan);}
.rise-pill b{font:700 22px Fredoka;line-height:1;}
.rise-pill.warn{border-color:var(--gold);}.rise-pill.warn span{color:var(--gold);}
.rise-pill.danger{border-color:var(--coral);background:#FF5A5F33;animation:pulseR .6s ease-in-out infinite;}.rise-pill.danger span{color:#fff;}
@keyframes pulseR{50%{box-shadow:0 0 18px var(--coral);}}
.rise{animation:riseUp .4s cubic-bezier(.2,.8,.3,1);}
@keyframes riseUp{from{transform:translateY(var(--cell));}to{transform:none;}}
.land{animation:land .22s ease-out;}
@keyframes land{0%{transform:scale(1.15,.82) translateY(8%);}60%{transform:scale(.95,1.06);}100%{transform:none;}}
.mout{animation:mout .26s ease-in forwards;}
@keyframes mout{to{transform:scale(.25);opacity:0;}}
.mtarget{animation:mt .26s ease-in-out;}
@keyframes mt{50%{transform:scale(1.18);filter:brightness(1.8);}}
.pop{animation:pop .34s cubic-bezier(.3,1.6,.5,1);}
@keyframes pop{0%{transform:scale(.2);filter:brightness(3);}100%{transform:scale(1);filter:none;}}
.fall{animation:fall var(--t) cubic-bezier(.5,0,1,1);}
@keyframes fall{from{transform:translateY(calc(var(--d) * var(--cell) * -1));}to{transform:none;}}

.float{position:absolute;font:700 20px Fredoka;color:var(--gold);text-shadow:0 0 10px #FFD447,0 2px 0 #0008;white-space:nowrap;transform:translate(-50%,-50%);animation:floatUp .9s ease-out forwards;}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0;}}
.callout{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font:700 38px Fredoka;color:#fff;text-shadow:0 0 18px var(--cyan),0 0 36px var(--cyan),0 3px 0 #0009;white-space:nowrap;pointer-events:none;z-index:40;animation:callout 1s ease-out forwards;}
@keyframes callout{0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}70%{opacity:1;}100%{transform:translate(-50%,-90%) scale(1);opacity:0;}}
.beam{position:absolute;background:linear-gradient(90deg,#fff0,#fff,#fff0);box-shadow:0 0 30px #fff,0 0 60px #FF5FC8;animation:beam .45s ease-out forwards;}
@keyframes beam{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}

#tip{margin-top:12px;min-height:44px;text-align:center;font-size:17px;color:#fff;max-width:340px;line-height:1.35;}
#tip b{color:var(--gold);}
.hand{position:absolute;font-size:38px;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 0 8px #FFD447);}
@keyframes bob{50%{transform:translateY(12px);}}

/* screens */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 20px;overflow-y:auto;background:radial-gradient(ellipse at 50% 20%,#24307a 0%,#0B1026 60%);}
.screen>*:first-child{margin-top:auto;}.screen>*:last-child{margin-bottom:auto;}
.screen.dim{background:#0B1026ee;}
.title{font:700 52px/1 Fredoka;text-align:center;color:var(--gold);text-shadow:0 0 24px #FFD44799,0 0 50px #FF8A1F66;}
.subtitle{font:600 16px Fredoka;letter-spacing:.2em;color:var(--cyan);text-align:center;}
.h2{font:700 34px Fredoka;color:var(--gold);text-shadow:0 0 18px #FFD44788;text-align:center;}
.btn{min-width:240px;min-height:56px;padding:12px 24px;border-radius:18px;font:700 21px Fredoka;letter-spacing:.04em;color:#000;}
.btn.lime{background:var(--lime);box-shadow:0 5px 0 #3ea832,0 0 24px #7CFF6B66;}
.btn.cyan{background:var(--cyan);box-shadow:0 5px 0 #1a8ea8,0 0 20px #3FE0FF55;}
.btn.ghost{background:var(--panel);color:#fff;border:2px solid var(--line);min-height:50px;font-size:17px;box-shadow:none;}
.btn:active{transform:translateY(3px);}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.row .btn{min-width:150px;}
.stats{font-size:17px;text-align:center;line-height:1.6;}
.stats .g{color:var(--gold);}
.gemrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:360px;}
.gemrow .chip{position:relative;width:36px;height:36px;}
.toggle{display:flex;justify-content:space-between;align-items:center;width:280px;min-height:52px;padding:0 16px;border-radius:14px;background:var(--panel);border:2px solid var(--line);color:#fff;font:700 18px Nunito;}
.toggle i{font-style:normal;font-weight:800;padding:4px 12px;border-radius:10px;background:var(--coral);color:#000;}
.toggle.on i{background:var(--lime);}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;max-width:380px;font-size:17px;line-height:1.5;}
.card p{margin-bottom:10px;}.card b{color:var(--gold);}
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;margin:6px 0 12px;}
.chain div{text-align:center;font-size:13px;}
.chain .chip{position:relative;width:44px;height:44px;margin:0 auto 2px;}
.newbest{font:700 22px Fredoka;color:#000;background:var(--gold);border-radius:12px;padding:4px 14px;animation:pop .5s;}
#hold{position:fixed;z-index:35;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:12px 16px;font-size:17px;display:flex;align-items:center;gap:10px;white-space:nowrap;box-shadow:0 0 24px #FFD44755;}
#hold .chip{position:relative;width:38px;height:38px;}

/* Journey Mode */
.mode.boss{color:var(--coral);}
.drops{text-align:center;min-width:64px;padding:4px 8px;border-radius:14px;background:var(--panel);border:2px solid var(--lime);}
.drops span{display:block;font:600 11px Fredoka;letter-spacing:.1em;color:var(--lime);}
.drops b{font:700 26px/1.1 Fredoka;}
.drops.low{border-color:var(--coral);}.drops.low span{color:var(--coral);}
#goal{position:relative;overflow:hidden;width:calc(var(--cell)*6 + 16px);margin-top:8px;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--gold);font-size:16px;}
#goal>i{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);box-shadow:0 0 8px var(--gold);transition:width .3s;}
#goal .gtxt{flex:1;}#goal .ghalf{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}#goal .ghalf.done .gnum{color:var(--lime,#9CFF57);}#goal .gstar{font:700 18px Fredoka;color:var(--gold);}
.gand{font:700 14px Fredoka;color:var(--gold);letter-spacing:2px;margin:4px 0;}.twists{color:var(--cyan,#3FE0FF);font-weight:700;margin-top:6px;}#goal .gnum{font:700 18px Fredoka;color:var(--gold);}
#goal .chip,.goalcard .chip{position:relative;display:inline-block;width:30px;height:30px;vertical-align:middle;}
.gstar{color:var(--gold);font-size:22px;}
.goalcard{text-align:center;min-width:270px;}
.goalcard .bigicon .chip{width:64px;height:64px;}.goalcard .bigicon .gstar{font-size:52px;}
.gbig{font:700 24px Fredoka;color:var(--gold);margin:4px 0;}
.warnline{color:var(--coral);margin-top:6px;}
.bossbadge{font:700 16px Fredoka;letter-spacing:.15em;color:#000;background:var(--coral);border-radius:10px;padding:4px 14px;}
.stars{display:flex;gap:8px;}
.st{font-size:20px;color:#ffffff66;}.st.on{color:var(--gold);text-shadow:0 0 10px #FFD447;}
.st.big{font-size:58px;color:#ffffff40;}.st.big.on{color:var(--gold);animation:starIn .5s cubic-bezier(.3,1.6,.5,1) both;}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0;}to{transform:none;opacity:1;}}
.btn.big{min-height:64px;font-size:24px;}
#map{justify-content:flex-start;}
#map>*:first-child{margin-top:0;}
.maphead{position:sticky;top:-24px;z-index:2;width:100%;max-width:400px;display:flex;align-items:center;justify-content:space-between;padding:8px 0;background:#0B1026f0;}
.mstars{font:700 20px Fredoka;color:var(--gold);}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 0 40px;}
.node-row{display:flex;flex-direction:column;align-items:center;gap:2px;}
.node{width:68px;height:68px;border-radius:50%;font:700 24px Fredoka;color:#fff;background:radial-gradient(circle at 40% 30%,#3a47a8,#1A1F4A);border:3px solid var(--gold);box-shadow:0 0 14px #FFD44744;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.node small{font-size:10px;letter-spacing:.1em;color:#fff;}
.node.boss{width:82px;height:82px;border-color:var(--coral);box-shadow:0 0 18px #FF5A5F77;}
.node.cur{border-color:var(--lime);box-shadow:0 0 0 6px #7CFF6B33,0 0 26px #7CFF6B;animation:pulseC 1.2s ease-in-out infinite;}
@keyframes pulseC{50%{box-shadow:0 0 0 10px #7CFF6B22,0 0 34px #7CFF6B;}}
.node.locked{border-color:var(--line);box-shadow:none;background:#1A1F4A;font-size:20px;}
.nstars .st{font-size:16px;}
.row .btn{min-width:140px;font-size:17px;padding:10px 14px;}

/* Phase 3: forest, sparkles, shake, glow, splash */
#forest{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;}
body{background:transparent!important;}
#sparks{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none;}
.screen{background:radial-gradient(ellipse at 50% 20%,#24307acc 0%,#0B102688 70%);}
.screen.dim{background:#0B1026e6;}
#boardWrap{background:#1A1F4Ae6;}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{20%{transform:translate(calc(var(--sh)*-1),calc(var(--sh)*.5));}40%{transform:translate(var(--sh),calc(var(--sh)*-.5));}60%{transform:translate(calc(var(--sh)*-.6),0);}80%{transform:translate(calc(var(--sh)*.4),0);}}
.g6::before,.g7::before,.g8::before{animation:glowP 2.4s ease-in-out infinite;}
@keyframes glowP{50%{opacity:.7;}}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 40%,#24307a 0%,#0B1026 65%);transition:opacity .55s;}
#splash.out{opacity:0;pointer-events:none;}
#splash .sgem{width:120px;height:120px;filter:drop-shadow(0 0 22px #FF5FC8) drop-shadow(0 0 40px #FFD000);animation:sgem 2s ease-in-out infinite;}
#splash .sgem svg{width:100%;height:100%;animation:shimmer 2.4s linear infinite;}
#splash .title{animation:pop .7s cubic-bezier(.3,1.6,.5,1);}
#splash .subtitle{animation:glowP 1.6s ease-in-out infinite;}
#splash .studio{margin-bottom:6px;text-align:center;font:700 20px Fredoka;letter-spacing:.28em;color:#FFFFFF;text-shadow:0 0 14px #FFD447,0 0 28px #FF8A1F99;}
@keyframes sgem{50%{transform:translateY(-10px) scale(1.05);}}

/* Phase 4: Grove Map */
#home{gap:10px;}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 #b38f1d,0 0 24px #FFD44766;}
.btn.pulse{animation:gpulse 1.4s ease-in-out infinite;}
@keyframes gpulse{50%{box-shadow:0 5px 0 #b38f1d,0 0 38px #FFD447;}}
.btn.restore{display:flex;flex-direction:column;align-items:center;min-width:300px;font-size:19px;line-height:1.2;}
.btn.restore span{font:800 16px Nunito;margin-top:2px;}
.btn.ghost.restore span{color:var(--gold);}
.nope{animation:nope .35s;}
@keyframes nope{25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.ghead{width:100%;max-width:400px;display:flex;justify-content:space-between;font:700 22px Fredoka;}
.glight{color:var(--gold);text-shadow:0 0 12px #FFD44788;}.gstars{color:#fff;}
.garea{width:100%;max-width:400px;display:flex;align-items:center;justify-content:space-between;text-align:center;}
.gname{font:700 26px Fredoka;color:var(--gold);text-shadow:0 0 16px #FFD44777;}
.gprog{font-size:16px;color:#fff;}
.arrow{width:48px;height:48px;border-radius:14px;background:var(--panel);border:2px solid var(--cyan);color:var(--cyan);font-size:20px;}
.arrow:disabled{opacity:.25;}
.gwrap{position:relative;width:100%;max-width:400px;border-radius:20px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 40px #0008;flex-shrink:0;}
.grove{display:block;width:100%;height:min(40vh,380px);}
.gbar{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);box-shadow:0 0 10px var(--gold);}
.gel{transition:filter .8s,opacity .8s;transform-box:fill-box;transform-origin:center bottom;}
.gel.off{filter:grayscale(1) brightness(.3);opacity:.8;}
.gel.off .halo,.gel.off .tw{animation:none;}
.gel.off .halo{display:none;}
.gel.on{filter:drop-shadow(0 0 5px var(--gc));}
.gel.nexttask{cursor:pointer;}
.gel.just{animation:grow 1.1s cubic-bezier(.3,1.5,.5,1);}
@keyframes grow{0%{transform:scale(.4);filter:brightness(3) drop-shadow(0 0 20px var(--gc));}100%{transform:none;}}
.tw{animation:twk 1.8s ease-in-out infinite;}
@keyframes twk{50%{opacity:.25;}}
.halo{animation:glowP 2.6s ease-in-out infinite;opacity:.8;}
.pin{animation:bob 1s ease-in-out infinite;cursor:pointer;}
.spirit{filter:drop-shadow(0 0 8px var(--gc));}
.spirit.wake{animation:grow 1.4s .9s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center;}
.gdone{max-width:340px;text-align:center;font-size:17px;color:#fff;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;}
#home .row .btn.ghost{min-width:0;min-height:46px;font-size:14px;padding:8px 11px;}
.spcard{display:flex;align-items:center;gap:14px;width:320px;padding:10px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--line);}
.spcard.on{border-color:var(--gc);box-shadow:0 0 18px color-mix(in srgb,var(--gc) 35%,transparent);}
.spcard svg{width:76px;height:76px;flex-shrink:0;}
.spcard .locked{filter:brightness(0) drop-shadow(0 0 1px #6c78bc);}
.spname{font:700 20px Fredoka;color:#fff;}.spcard.on .spname{color:var(--gold);}
.sparea{font-size:15px;color:#fff;}

/* fit short phone screens: never squeeze menu items, tighter home */
.screen>*{flex-shrink:0;}
#home{gap:8px;padding:14px 16px 18px;}
.grove{height:min(31vh,380px);}
#home .btn.big{min-height:58px;}
#home .btn.restore{min-height:58px;padding:8px 18px;}
.maphead{margin:0 -20px;width:calc(100% + 40px);max-width:none;padding:10px 20px;background:#0B1026;box-shadow:0 6px 16px #0B1026;}

/* v0.8: darker screen, soft gem glow, power-ups, forest path */
#boardWrap{background:#0e1336d9;}
.cell{border-color:#2E357744;}
.gem::before{inset:-18%;opacity:.5;animation:gemGlow 3.4s ease-in-out infinite;}
@keyframes gemGlow{50%{opacity:.75;}}
#powers{display:flex;gap:12px;margin-top:10px;}
.pwr{display:flex;align-items:center;gap:6px;min-height:48px;padding:6px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--line);color:#fff;font:700 22px Fredoka;}
.pwr span{font-size:16px;}.pwr b{min-width:26px;height:26px;border-radius:13px;background:var(--gold);color:#000;font:800 16px/26px Nunito;}
.pwr.on{border-color:var(--gold);box-shadow:0 0 18px #FFD44788;}
body.aiming .col{background:linear-gradient(180deg,#FFD44722,#FFD44705);}
body.aiming .col.on{background:linear-gradient(180deg,#FFD44766,#FFD44718);}
.pbomb{display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.7);filter:drop-shadow(0 0 10px #FF8A1F);}
.item{display:flex;align-items:center;gap:12px;width:100%;max-width:360px;padding:12px;border-radius:16px;background:var(--panel);border:2px solid var(--line);}
.iicon{font-size:40px;}
.itxt{flex:1;display:flex;flex-direction:column;font-size:15px;line-height:1.35;}
.itxt b{font:700 20px Fredoka;color:var(--gold);}
.itxt .own{color:var(--cyan);font-weight:800;}
.btn.buy{min-width:96px;min-height:50px;font-size:19px;padding:8px 12px;}
.glight.big{font-size:30px;}
.path{position:relative;}
.trail{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
.trail path{fill:none;stroke-width:6;stroke-linecap:round;}
.trail .lit{stroke:#FFD447;filter:drop-shadow(0 0 6px #FFD447);}
.trail .dim{stroke:#2E3577;stroke-dasharray:4 12;}
.node-row{position:relative;}
.node{position:relative;z-index:1;}
.node.done{border-color:#7CFF6B99;}
.node.pending{border-color:var(--line);box-shadow:none;background:#1A1F4A;}
.node.arrived{animation:pop .5s cubic-bezier(.3,1.6,.5,1);}
.deco{position:absolute;left:50%;top:50%;width:46px;height:46px;transition:filter 1s;}
.deco.lit{filter:drop-shadow(0 0 7px var(--dc)) drop-shadow(0 0 14px var(--dc));animation:glowP 2.8s ease-in-out infinite;}
.deco:not(.lit){filter:grayscale(1) brightness(.3);}
.wisp{position:absolute;z-index:3;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#D9FF6B 40%,#D9FF6B00 72%);box-shadow:0 0 22px #D9FF6B,0 0 40px #FFD447;pointer-events:none;}

/* v0.8.1: several shades darker, clearer power-up buttons */
#boardWrap{background:#060920e6;border-color:#232a60;}
.screen{background:radial-gradient(ellipse at 50% 20%,#141b48cc 0%,#03050fb0 70%);}
.screen.dim{background:#03050fee;}
.maphead{background:#03050f;box-shadow:0 6px 16px #03050f;}
#powers{gap:10px;}
.pwr{border-color:var(--gold);font-size:22px;padding:6px 12px;}
.pwr span{font:700 15px Fredoka;letter-spacing:.03em;}
.pwr.hint{animation:gpulse2 1.2s ease-in-out infinite;}
@keyframes gpulse2{50%{box-shadow:0 0 22px #FFD447;}}

/* v0.8.2: stronger gem glow, darker board, bigger board */
#app{padding-top:6px;}
#goal{margin-top:6px;}
#nextRow{margin:4px 0 6px;height:56px;}
#powers{margin-top:8px;}
#tip{position:fixed;left:0;right:0;bottom:6px;margin:0 auto;padding:0 12px;min-height:0;font-size:16px;line-height:1.3;pointer-events:none;}
#boardWrap{background:#04061ae8;border-color:#1b2150;}
.cell{border-color:#2E357730;}
.cell::after{background:#2E357740;}
.gem::before{inset:-32%;background:radial-gradient(circle,var(--c) 0%,transparent 64%);opacity:.75;animation:gemGlow 3.4s ease-in-out infinite;}
@keyframes gemGlow{50%{opacity:1;}}
.gem svg{filter:drop-shadow(0 0 4px var(--c));}
#nextRow{height:50px;margin:3px 0 5px;}
.next.big{width:50px;height:50px;}
.next.small{width:38px;height:38px;}
.rise-pill{height:46px;}
#tip{bottom:3px;}
.pwr{min-height:44px;padding:5px 10px;gap:5px;}
.pwr span{white-space:nowrap;font-size:14px;}
#tip{bottom:0;}

/* v0.8.3: glow baked into each gem picture (fast on low-memory phones) */
.gem::before{content:none;animation:none;}
.gi{position:absolute;inset:-32%;background:center/contain no-repeat;pointer-events:none;}
.g8 .gi{animation:shimmer 1.2s linear infinite;}

/* v0.9: creatures and bosses */
.gem.crit .gi{inset:-22%;}
.gem .hp{position:absolute;left:50%;bottom:-4%;transform:translateX(-50%);font:900 calc(var(--cell)*.22) Nunito;font-style:normal;letter-spacing:2px;color:#FF5A5F;text-shadow:0 0 6px #FF5A5F,0 1px 0 #000;}
.gem.restless{animation:wiggle .45s ease-in-out infinite;}
@keyframes wiggle{25%{transform:rotate(-9deg) scale(1.06);}75%{transform:rotate(9deg) scale(1.06);}}
.gem.petrify{filter:grayscale(1) brightness(.8);transition:filter .4s;}
.gem.hurt{animation:hurt .35s;}
@keyframes hurt{30%{filter:brightness(2.5) saturate(0);transform:scale(.9);}}
.tendril{position:absolute;height:7px;margin-top:-3.5px;transform-origin:0 50%;border-radius:4px;background:var(--tc);box-shadow:0 0 10px var(--tc);animation:reach .55s ease-in-out forwards;pointer-events:none;z-index:3;}
@keyframes reach{0%{clip-path:inset(0 100% 0 0);}45%{clip-path:inset(0 0 0 0);}100%{clip-path:inset(0 0 0 0);opacity:0;}}
.areabanner{display:flex;align-items:center;gap:8px;font:700 18px Fredoka;letter-spacing:.12em;color:var(--ac);text-shadow:0 0 12px var(--ac);padding:6px 16px;border-radius:14px;border:2px solid var(--ac);background:#03050fcc;}
.areabanner .chip,.crittip .chip{position:relative;display:inline-block;width:40px;height:40px;flex-shrink:0;}
.areaname{font:700 16px Fredoka;letter-spacing:.14em;color:var(--ac);text-shadow:0 0 12px var(--ac);text-align:center;}
.bossname{font:700 24px Fredoka;color:var(--coral);text-shadow:0 0 14px var(--coral);text-align:center;}
.crittip{display:flex;align-items:center;gap:12px;}
.tipcard{font-size:16px;line-height:1.4;max-width:340px;}.tipcard b{color:var(--gold);}
.areabanner{position:relative;z-index:2;margin:10px 0;}
.gem .hp{bottom:2%;padding:0 5px;border-radius:8px;background:#000c;color:#fff;font-size:calc(var(--cell)*.2);line-height:1.25;text-shadow:0 0 6px #FF5A5F;letter-spacing:1px;}
.gem.bosspart.g30 .hp,.gem.bosspart.g31 .hp,.gem.bosspart.g32 .hp,.gem.bosspart.g33 .hp,.gem.bosspart.g34 .hp,.gem.bosspart.g35 .hp,.gem.bosspart.g36 .hp,.gem.bosspart.g37 .hp,.gem.bosspart.g38 .hp,.gem.bosspart.g39 .hp{z-index:1;}
.btn.danger{background:var(--coral);color:#000;box-shadow:0 5px 0 #a8343a,0 0 18px #FF5A5F55;}
.resethead{font:700 15px Fredoka;letter-spacing:.16em;color:var(--coral);margin-top:10px;}
#help .row .btn.danger{min-width:150px;font-size:16px;}
.rowhl{position:absolute;left:0;right:0;border-radius:10px;background:linear-gradient(90deg,#FF8A1F00,#FF8A1F55,#FF8A1F00);box-shadow:inset 0 0 0 2px #FFD447aa;pointer-events:none;}
.pbombrow{position:absolute;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.8);animation:pop .25s;filter:drop-shadow(0 0 12px #FF8A1F);}

/* v0.10.2: show 3 upcoming gems, all the same easy-to-see size, bigger numbers */
#nextRow{height:60px;gap:8px;}
.next-label{font-size:14px;letter-spacing:.08em;}
.next.big,.next.small{width:56px;height:56px;opacity:1;}
.next .gem .num{font-size:17px;line-height:21px;padding:0 6px;border-radius:8px;right:2%;bottom:2%;}
.rise-pill{min-width:74px;}
